<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>面談日程の調整</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/booking/booking.css" />
<script src="/assets/booking/booking.js" defer></script>
<style>
  :root {
    --navy: #0a4c9c;
    --navy-deep: #073a78;
    --orange: #ffbd5c;
    --yellow: #fff27a;
    --ink: #3b3b3b;
    --ink-soft: #5c5c5c;
    --line: #e3e7ee;
    --pale: #eef3fa;
  }
  html, body { margin: 0; padding: 0; background: var(--navy); }
  *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    min-height: 100vh; min-height: 100dvh;
    font-family: 'M PLUS Rounded 1c', 'Noto Sans JP', sans-serif;
    color: var(--ink);
    padding: calc(16px + env(safe-area-inset-top)) 12px calc(24px + env(safe-area-inset-bottom));
  }
  .page { max-width: 760px; margin: 0 auto; }
  .card {
    background: #ffffff;
    border: 8px solid var(--orange);
    border-radius: 26px;
    padding: 26px 14px 24px;
  }
  .page-title {
    margin: 0 0 18px; text-align: center;
    font-size: 23px; font-weight: 800; line-height: 1.4; letter-spacing: .06em; color: var(--ink);
  }
  .page-title span {
    background: linear-gradient(transparent 58%, var(--yellow) 58%, var(--yellow) 92%, transparent 92%);
    padding: 0 4px;
  }

  /* ===== 予約画面(ページ内表示) ===== */
  #booking-inline .bk-overlay {
    --bk-bg: #ffffff;
    --bk-head-bg: #ffffff;
    --bk-surface: #ffffff;
    --bk-line: var(--line);
    --bk-line-strong: #c9d3e1;
    --bk-text: var(--ink);
    --bk-muted: var(--ink-soft);
    --bk-faint: #b9c0cb;
    --bk-accent: var(--navy);
    --bk-slot-bg: var(--navy);
    --bk-slot-line: var(--navy);
    --bk-slot-hover-bg: var(--navy-deep);
    --bk-slot-hover-text: #ffffff;
    --bk-primary-bg: var(--navy);
    --bk-primary-text: #ffffff;
    --bk-when-bg: #fffbe0;
    --bk-when-line: #f3e6a0;
    --bk-when-label: var(--navy);
    --bk-error: #c2410c;
    --bk-notice-bg: #fff1e6;
    --bk-mock-bg: #fff4e5;
    --bk-mock-text: #8a4b14;
    --bk-radius: 14px;
    --bk-radius-btn: 999px;
    --bk-font-head: 'M PLUS Rounded 1c', 'Noto Sans JP', sans-serif;
    --bk-font-label: 'M PLUS Rounded 1c', 'Noto Sans JP', sans-serif;
    position: static; inset: auto; z-index: auto; display: block; padding: 0;
    background: transparent; -webkit-backdrop-filter: none; backdrop-filter: none;
    font-family: 'M PLUS Rounded 1c', 'Noto Sans JP', sans-serif;
  }
  #booking-inline .bk-overlay[hidden] { display: none; }
  #booking-inline .bk-dialog {
    max-width: none; height: auto; max-height: none; overflow: visible;
    border: 0; border-radius: 0; box-shadow: none; background: transparent; animation: none;
  }
  #booking-inline .bk-head { justify-content: center; padding: 0 0 16px; background: transparent; border-bottom: 2px dashed var(--line); }
  #booking-inline .bk-title { font-size: 14px; font-weight: 700; text-align: center; color: var(--ink-soft); }
  #booking-inline .bk-body { overflow: visible; padding: 18px 0 0; }
  #booking-inline .bk-intro { text-align: center; font-weight: 500; }
  #booking-inline .bk-sec-title { justify-content: center; font-size: 15px; font-weight: 800; letter-spacing: .06em; }
  #booking-inline .bk-early-btn { background: var(--pale); border-color: var(--pale); font-weight: 700; }
  #booking-inline .bk-early-btn:hover { background: #e2ebf7; border-color: var(--navy); }
  #booking-inline .bk-slot { background: var(--navy); border-color: var(--navy); color: #ffffff; }
  #booking-inline .bk-slot:hover { background: var(--navy-deep); border-color: var(--navy-deep); color: #ffffff; }
  #booking-inline .bk-cell { color: #c3c9d2; }
  #booking-inline .bk-gh.is-off { color: #a3abb7; }
  #booking-inline .bk-gt { color: var(--ink-soft); }
  #booking-inline .bk-overlay .bk-primary { font-weight: 800; box-shadow: 0 6px 14px rgba(10, 76, 156, .22); }
  #booking-inline button:focus-visible, #booking-inline a:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }

  @media (max-width: 640px) {
    #booking-inline .bk-overlay { padding: 0; }
    #booking-inline .bk-dialog { height: auto; max-height: none; }
    #booking-inline .bk-head { padding: 0 0 14px; }
    #booking-inline .bk-body { padding: 16px 0 0; }
    #booking-inline .bk-grid { padding: 4px; gap: 3px; }
  }
  @media (max-width: 359.98px) {
    body { padding-left: 8px; padding-right: 8px; }
    .card { border-width: 6px; border-radius: 22px; padding: 22px 10px 20px; }
    .page-title { font-size: 21px; }
  }
  @media (min-width: 641px) {
    body { padding-top: 40px; padding-bottom: 48px; }
    .card { border-width: 10px; border-radius: 32px; padding: 36px 36px 34px; }
    .page-title { font-size: 28px; margin-bottom: 22px; }
  }
</style>
</head>
<body>
<main class="page">
  <div class="card">
    <h1 class="page-title"><span>面談日程の調整</span></h1>
    <div id="booking-inline" data-fallback="https://calendar.app.google/QHcVtt3HSc3vjNwj9"></div>
  </div>
</main>
</body>
</html>
